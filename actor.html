<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Actor Guessing Game</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    
    <div class="container mt-4">


    <h1>Actors by Lakshmi Tejaswini Davuluri</h1>

    <form>
        <label for="secretActor">Peter Pan</label>
        <input type="password" id="secretActor" value="Robin Williams" class="form-control w-50">


        <br>

        <label for="actorGuess">Who is the actor</label>
        <input type="text" id="actorGuess" class="form-control w-50">
        <br>
  
    <button type="button" id="guessButton"
            class="btn btn-success mt-3"
            onclick="checkActor()">
        Check the guess
    </button>

    </form>

    <p id="result">Correct: 0 Not Correct: 0</p>
    <div>
      
        <img id="foodPic"
            src="lasagna.jpg"
            width="150"
            height="150"
            class="rounded shadow border border-success mt-3"
            style="object-fit: cover; cursor: pointer;"
            onclick="updatePic()">
    </div>

    <script>

        let correct = 0;
        let notCorrect = 0;
        let usePic = 1;

        function checkActor() {

            let actor =
                document.getElementById("secretActor").value;

            let guess =
                document.getElementById("actorGuess").value;

            if (actor === guess) {

                correct++;
                alert("That's right");

            } else {

                notCorrect++;
                alert("Better luck next time");

            }
            
            if (notCorrect > 10) {
                document.getElementById("guessButton").onclick = tooManyGuesses;
            }


            document.getElementById("result").innerHTML =
                "Correct: " + correct +
                " Not Correct: " + notCorrect;
        }


        function updatePic() {

            switch (usePic) {

                case 1:
                    document.getElementById("foodPic").src =
                        "apple.jpg";
                    usePic = 2;
                    break;

                case 2:
                    document.getElementById("foodPic").src =
                        "donut.jpg";
                    usePic = 3;
                    break;

                case 3:
                    document.getElementById("foodPic").src =
                        "lasagna.jpg";
                    usePic = 1;
                    break;

            }
        }
     
    function tooManyGuesses() {
        alert("Sorry, too many wrong guesses.");
    }

    </script>   
    
   </div>

</body>
</html>
