<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Actor Guessing Game</title>
</head>

<body>

    <h1>Actors by Lakshmi Tejaswini Davuluri</h1>

    <form>
        <label for="secretActor">Peter Pan</label>
        <input type="password" id="secretActor" value="Robin Williams">

        <br><br>

        <label for="actorGuess">Who is the actor</label>
        <input type="text" id="actorGuess">

        <br><br>

        <button type="button" onclick="checkActor()">
            Check the guess
        </button>
    </form>

    <p id="result">Correct: 0 Not Correct: 0</p>

    <div>
        <img id="foodPic"
             src="lasagna.jpg"
             width="150"
             height="150"
             onclick="updatePic()">
    </div>

    <script>

        let correct = 0;
        let notCorrect = 0;
        let usePic = 1;

        function checkActor() {

            let actor =
                document.getElementById("secretActor").value;

            let guess =
                document.getElementById("actorGuess").value;

            if (actor === guess) {

                correct++;
                alert("That's right");

            } else {

                notCorrect++;
                alert("Better luck next time");

            }

            document.getElementById("result").innerHTML =
                "Correct: " + correct +
                " Not Correct: " + notCorrect;
        }


        function updatePic() {

            switch (usePic) {

                case 1:
                    document.getElementById("foodPic").src =
                        "apple.jpg";
                    usePic = 2;
                    break;

                case 2:
                    document.getElementById("foodPic").src =
                        "donut.jpg";
                    usePic = 3;
                    break;

                case 3:
                    document.getElementById("foodPic").src =
                        "lasagna.jpg";
                    usePic = 1;
                    break;

            }
        }

    </script>

</body>
</html>
