
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <div class="container mt-4">

    <h1>Lakshmi Tejaswini Davuluri meal planner</h1>
    

<form>
    <div class="form-check">
        <input type="checkbox" id="breakfast" value="True"
               class="form-check-input">
        <label for="breakfast" class="form-check-label">Breakfast</label>
    </div>

    <div class="form-check">
        <input type="checkbox" id="lunch" value="False"
               class="form-check-input">
        <label for="lunch" class="form-check-label">Lunch</label>
    </div>

    <div class="form-check">
        <input type="checkbox" id="dinner" value="True"
               class="form-check-input">
        <label for="dinner" class="form-check-label">Dinner</label>
    </div>

    <br>

    <button type="button" class="btn btn-success mt-3" onclick="choices()">
        Meal Plan Choices
    </button>


</form>



<h3>Update Your Meal Plan</h3>

<form>
    <label for="cuisine">Enter cuisine type</label>
    <input type="text" id="cuisine" value="Italian"
           class="form-control w-50">
    <br>

    <label for="beverage">Enter beverage choice</label>
    <input type="text" id="beverage" value="water"
           class="form-control w-50">
    <br>

    <button type="button" class="btn btn-success mt-3" onclick="updateMeal()">
        Update the meal plan
    </button>


</form>
<p id="result" class="alert alert-success mt-3">
    Your meal choices will appear here.
</p>

<script>
    let my_meal_plan = {};

    function choices() {
        my_meal_plan = {};

        my_meal_plan.breakfast =
            document.getElementById("breakfast").checked;

        my_meal_plan.lunch =
            document.getElementById("lunch").checked;

        my_meal_plan.dinner =
            document.getElementById("dinner").checked;

                    
        document.getElementById("result").innerHTML =
            "Breakfast: " + my_meal_plan.breakfast +
            "; Lunch: " + my_meal_plan.lunch +
            "; Dinner: " + my_meal_plan.dinner +
            "; Cuisine: " + (my_meal_plan.cuisine || "") +
            "; Beverage: " + (my_meal_plan.beverage || "");


    }
    
    function updateMeal() {
        let cuisine = document.getElementById("cuisine").value;
        let beverage = document.getElementById("beverage").value;

        my_meal_plan["cuisine"] = cuisine;
        my_meal_plan["beverage"] = beverage;

        document.getElementById("result").innerHTML =
            "Breakfast: " + my_meal_plan.breakfast +
            "; Lunch: " + my_meal_plan.lunch +
            "; Dinner: " + my_meal_plan.dinner +
            "; Cuisine: " + (my_meal_plan.cuisine || "") +
            "; Beverage: " + (my_meal_plan.beverage || "");

    }

</script>
</div>
</body>
</html>
